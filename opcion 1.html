<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora CNC v2.0 - DEVICE</title>
    
    <!-- Librerías Externas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script> <!-- Lector QR -->
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0026e3; /* Azul Eléctrico Puro */
            --bg-gradient: linear-gradient(160deg, #00188f 0%, #0026e3 100%);
            --glass-panel: #ffffff;
            
            /* Colores de Acción */
            --btn-out: #d90429; /* Rojo Caramelo */
            --btn-out-hover: #b90424;
            --btn-in: #00b347; /* Verde Esmeralda */
            --btn-in-hover: #008f39;
            
            /* Branding DEVICE Clean */
            --brand-bg: #001242;
            --brand-text: #ffffff;
            --brand-border: #ffffff;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            font-family: 'Roboto', sans-serif;
            padding-bottom: 50px;
        }

        /* --- LOGO DEVICE (Versión Plana/Industrial) --- */
        .device-header {
            text-align: center;
            padding: 20px 0;
        }
        .device-logo-box {
            display: inline-block;
            background-color: var(--brand-bg);
            border: 2px solid var(--brand-border);
            padding: 10px 40px;
            margin-bottom: 10px;
            /* Eliminado box-shadow y text-shadow para quitar fluorescencia */
        }
        .device-logo-text {
            font-family: 'Chakra Petch', sans-serif; /* Fuente más técnica */
            font-size: 2.5rem;
            color: var(--brand-text);
            margin: 0;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* --- PANELES --- */
        .main-card {
            background: var(--glass-panel);
            border-radius: 8px; /* Bordes menos redondeados para look industrial */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: none;
            overflow: hidden;
        }

        /* --- QR SCANNER --- */
        #reader {
            width: 100%;
            border: 1px solid #ccc;
            background: #000;
            display: none; /* Oculto por defecto */
            margin-bottom: 15px;
        }
        .scanner-active { display: block !important; }

        /* --- BOTONES DE ESTADO --- */
        .btn-check:checked + .btn-outline-danger {
            background-color: var(--btn-out);
            color: white;
            border-color: var(--btn-out);
        }
        .btn-check:checked + .btn-outline-success {
            background-color: var(--btn-in);
            color: white;
            border-color: var(--btn-in);
        }
        
        /* Botón Principal Dinámico */
        .btn-action-main {
            transition: all 0.3s;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1.2rem;
            border: none;
        }
        .mode-salida { background-color: var(--btn-out); color: white; }
        .mode-salida:hover { background-color: var(--btn-out-hover); color: white; }
        
        .mode-entrada { background-color: var(--btn-in); color: white; }
        .mode-entrada:hover { background-color: var(--btn-in-hover); color: white; }

        /* --- CANVAS FIRMA --- */
        canvas#signature-pad {
            border: 1px solid #ced4da;
            background: #f8f9fa;
            width: 100%;
            height: 120px;
            cursor: crosshair;
            touch-action: none;
        }
        
        /* --- TABLA --- */
        .table-custom thead { background-color: #212529; color: white; }
        .cat-tag { font-size: 0.75rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        .cat-medicion { background-color: #6610f2; color: white; } /* Morado para medición */
        .cat-material { background-color: #fd7e14; color: white; } /* Naranja para material */

    </style>
</head>
<body>

<div class="container mt-4">
    
    <!-- Encabezado Clean -->
    <div class="device-header">
        <div class="device-logo-box">
            <h1 class="device-logo-text">DEVICE</h1>
        </div>
        <div class="text-white small text-uppercase" style="letter-spacing: 2px;">Control de Almacén CNC & Metrología</div>
    </div>

    <!-- Barra de Info / Responsable -->
    <div class="card mb-3 shadow-sm rounded-0 border-0">
        <div class="card-body py-2 d-flex justify-content-between align-items-center bg-light">
            <div class="d-flex align-items-center w-50">
                <i class="fas fa-id-badge fa-lg me-2 text-dark"></i>
                <input type="text" id="dispatcherName" class="form-control form-control-sm border-0 bg-transparent fw-bold text-primary" 
                       placeholder="NOMBRE DEL ALMACENISTA (Click para editar)" onchange="guardarResponsable()" style="box-shadow: none;">
            </div>
            <div class="fw-bold font-monospace" id="reloj">00:00:00</div>
        </div>
    </div>

    <div class="row">
        <!-- COLUMNA IZQUIERDA: REGISTRO -->
        <div class="col-lg-5 mb-4">
            <div class="main-card h-100">
                <div class="p-3 bg-dark text-white d-flex justify-content-between align-items-center">
                    <h5 class="m-0"><i class="fas fa-qrcode"></i> Registro</h5>
                    <button class="btn btn-sm btn-outline-warning" id="btn-cam" onclick="toggleCamera()">
                        <i class="fas fa-camera"></i> Activar Lector QR
                    </button>
                </div>
                
                <!-- Visor de Cámara -->
                <div id="reader"></div>

                <div class="p-4">
                    <form id="bitacoraForm">
                        
                        <!-- 1. TIPO DE MOVIMIENTO -->
                        <div class="mb-3 text-center">
                            <label class="form-label d-block text-muted small fw-bold">TIPO DE MOVIMIENTO</label>
                            <div class="btn-group w-100" role="group">
                                <input type="radio" class="btn-check" name="tipoAccion" id="btnSalida" value="SALIDA" checked onchange="actualizarUI()">
                                <label class="btn btn-outline-danger" for="btnSalida">SALIDA (Entregar)</label>

                                <input type="radio" class="btn-check" name="tipoAccion" id="btnEntrada" value="DEVOLUCION" onchange="actualizarUI()">
                                <label class="btn btn-outline-success" for="btnEntrada">DEVOLUCIÓN (Recibir)</label>
                            </div>
                        </div>

                        <!-- 2. CATEGORÍA (Vital para reportes separados) -->
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">CATEGORÍA DEL ÍTEM</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-tags"></i></span>
                                <select class="form-select fw-bold" id="categoria">
                                    <option value="MATERIAL">🔩 MATERIAL / INSUMO / HERRAMIENTA</option>
                                    <option value="MEDICION">📏 EQUIPO DE MEDICIÓN (Calibrado)</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-2">
                            <div class="col-5">
                                <label class="form-label small">SKU / QR</label>
                                <input type="text" id="sku" class="form-control fw-bold" placeholder="Escanear..." required>
                            </div>
                            <div class="col-7">
                                <label class="form-label small">Descripción</label>
                                <input type="text" id="descripcion" class="form-control" placeholder="Nombre ítem..." required>
                            </div>
                            <div class="col-4">
                                <label class="form-label small">Cant.</label>
                                <input type="number" id="cantidad" class="form-control" value="1" min="1">
                            </div>
                            <div class="col-8">
                                <label class="form-label small">Aplicación / Proyecto</label>
                                <input type="text" id="aplicacion" class="form-control" placeholder="O.P. / Máquina">
                            </div>
                        </div>

                        <div class="mt-3">
                            <label class="form-label small">Nombre quien se lleva/entrega (Operario)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" id="operario" class="form-control" placeholder="Nombre completo" required>
                            </div>
                        </div>

                        <!-- FIRMA -->
                        <div class="mt-3 border-top pt-2">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="small fw-bold">Firma Operario</label>
                                <button type="button" class="btn btn-sm btn-link text-danger text-decoration-none p-0" onclick="limpiarFirma()">Borrar Firma</button>
                            </div>
                            <canvas id="signature-pad"></canvas>
                        </div>

                        <div class="mt-4">
                            <button type="button" class="btn btn-action-main w-100 py-3 mode-salida" id="btnAccion" onclick="registrarMovimiento()">
                                CONFIRMAR SALIDA
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: HISTORIAL Y REPORTES -->
        <div class="col-lg-7">
            <div class="main-card h-100">
                <div class="p-3 bg-white border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="m-0 text-dark"><i class="fas fa-clipboard-list"></i> Bitácora</h5>
                    
                    <!-- MENU DE REPORTES -->
                    <div class="dropdown">
                        <button class="btn btn-dark btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="fas fa-file-csv"></i> Generar Reportes
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" onclick="exportarReporte('TODO')">📥 Completo (Todo)</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="exportarReporte('MEDICION')">📏 Solo Reporte MEDICIÓN</a></li>
                            <li><a class="dropdown-item" href="#" onclick="exportarReporte('MATERIAL')">🔩 Solo Reporte MATERIALES</a></li>
                        </ul>
                    </div>
                </div>

                <div class="table-responsive" style="max-height: 700px; overflow-y: auto;">
                    <table class="table table-hover align-middle mb-0 table-custom small">
                        <thead class="position-sticky top-0 z-1">
                            <tr>
                                <th>Mov.</th>
                                <th>Cat.</th>
                                <th>Detalle</th>
                                <th>Operario</th>
                                <th>Firma</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-registros">
